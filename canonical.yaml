# The canonical build every client is generated from: the live Elevate demo.
# Read by `factory pull-canonical` (templatize) and `factory build` (worker
# fields, leakage check). Public identifiers only; no secrets in this file.
#
# Fill the empty ids once from the Vapi and Cloudflare dashboards, then run
# `npm run factory -- pull-canonical`. When a bug is fixed, fix the canonical
# first, re-pull, then rebuild clients.

# Vapi assistant "Elevate Medical Spa — Claire" (read 2026-11-05, v21 published).
assistantId: 8b605779-a82e-49c4-88ee-f1f5bf9dd8c2
# Base URL of the elevate-demo Worker, as Elevate's tools call it.
workerUrl: https://elevate-demo.sidarthgaonkar.workers.dev
# Elevate's tools are unprefixed (getServices, checkAvailability,
# bookAppointment, urgentCallback).
toolPrefix: ""
# elevate_knowledge_base.txt, the Aug 17 7.13 KB copy the assistant uses.
# Two files share that name; always go by this id.
knowledgeBaseFileId: dbe35915-e6b5-49c6-92eb-fc3ab8847b70

# Elevate literals -> template tokens. Longest match wins and word boundaries
# are respected, so "Elevate" never touches "elevated". After pulling, check
# the printed counts: a literal with count 0 is misspelled here, and anything
# Elevate-specific the swaps miss (hours text, consult service line,
# front-desk line) is tokenized by hand in templates/vapi/assistant.json.
replace:
  Elevate Medical Spa: CLIENT_NAME
  Elevate: CLIENT_NAME
  elevate-demo: WORKER_NAME
  Claire: RECEPTIONIST
  America/Chicago: CLIENT_TZ
  Central: SPOKEN_TZ
  # Add once seen in the Worker code:
  # "[ELEVATE DEMO]": EVENT_PREFIX

# Never modify the Lumen demo line: assistant "Lumen Aesthetics — Claire"
# (789ff48e-4298-4b76-bc61-2a5a28f8475c) on +1 615 552 0990 uses its own
# four tools, separate from Elevate's. Reading it is fine.

# Names that must never appear in a client build. A client whose own name
# contains one of these is exempt from that entry only.
forbidden:
  - Elevate
  - Lumen
  - Nashville Skin Society
  - Toxxology

# Canonical-specific text that must not survive into a client build: the
# leakage check fails on any of these unless it is part of the client's own
# config. Add to it whenever a hand-tokenizing pass finds a new one.
canonicalLeftovers:
  - Nashville
  - Tennessee
  - injectableConsult
  - Lash and brow
  - 10 AM to 4 PM

worker:
  # Field names inside each SERVICES entry of templates/worker/index.js
  # (elevate-demo uses label / minutes / aliases).
  serviceFields:
    label: label
    minutes: minutes
    aliases: aliases
